# The raptaboard Doom plugin: room4doom (vendor/room4doom, with our patch) as
# a raptaboard tab plugin, built for WebAssembly. The standalone game
# (`make engine`, `make play`) is unchanged; this is built alongside it
# (`make plugin`).
[package]
name = "doom"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# raptaboard's plugin SDK, at the commit with the API this was written for (0.3,
# with the mouse, release-focus and [limits] call_ms: raptaboard#103).
raptaboard-plugin = { git = "https://github.com/tuffinmuffin/raptaboard", rev = "14a9af0cb36505c6afd742dd9f4f01c8250518f3" }

gamestate = { path = "../vendor/room4doom/gamestate" }
gamestate-traits = { path = "../vendor/room4doom/gamestate-traits" }
gameplay = { path = "../vendor/room4doom/gameplay", features = ["software25d"] }
game-config = { path = "../vendor/room4doom/game-config" }
# Its software25d feature lists that renderer in the options menu (with none
# listed, the Renderer choice had no options and the menu panicked).
doom-ui = { path = "../vendor/room4doom/game-ui", features = ["software25d"] }
ui-draw = { path = "../vendor/room4doom/game-ui-draw" }
input = { path = "../vendor/room4doom/input", default-features = false }
render-common = { path = "../vendor/room4doom/render/common" }
render-backend = { path = "../vendor/room4doom/render/backend", default-features = false, features = ["software25d", "display-buffer"] }
pic-data = { path = "../vendor/room4doom/pic-data" }
wad = { path = "../vendor/room4doom/wad" }
sound-common = { path = "../vendor/room4doom/sound/common" }
# The music: room4doom's OPL2 synthesizer (pure Rust; its rodio backend
# needs an audio device, which a plugin doesn't have).
opl2_emulator = { path = "../vendor/room4doom/sound/opl2_emulator" }
math = { path = "../vendor/room4doom/math" }
log = "0.4"
# room4doom's config format, to write the controls for raptaboard's keys.
# (room4doom's own: the same git source its lock pins.)
nanoserde = { git = "https://github.com/not-fl3/nanoserde.git", default-features = false, features = ["ron"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace]
