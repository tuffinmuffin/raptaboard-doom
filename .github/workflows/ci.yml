name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The raptaboard plugin: room4doom (pinned and patched) built for
  # WebAssembly, its tests and lints. The WADs and sprites are built only for
  # a release (they need the downloads).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: make setup patched
      - name: Format, lints, tests and the WebAssembly build
        working-directory: plugin
        run: |
          cargo fmt --check
          cargo clippy --target wasm32-wasip2 --all-targets -- -D warnings
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release --target wasm32-wasip2
